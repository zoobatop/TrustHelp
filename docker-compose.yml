version: '3.8'
services:
  trusthelp-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/trusthelp_prod
      - DB_USERNAME=trusthelp_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INIT_PASSWORD}
    depends_on:
      - db
    volumes:
      - app-logs:/app/logs
    restart: unless-stopped
  
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=THELP
      - POSTGRES_USER=admin_thelp
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  app-logs: